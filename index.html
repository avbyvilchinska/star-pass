<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Зоряний шлях — гра у власне життя: виконуй 3 справи на день, збирай зірки й обмінюй їх на винагороди, які сам собі призначив.">
<meta name="theme-color" content="#2E3ECF">
<title>Зоряний шлях</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E59B00' d='M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky score bar + 4 tabs (Сьогодні · Календар · Винагороди · Профіль); landing/auth/onboarding live in #gate */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#E8ECF6; --fg:#151A2D; --muted:#5A6283; --line:#D6DCEA;
  --ink:#2E3ECF; --ink-soft:#E3E6FB; --star:#E59B00; --star-ink:#7A5200; --star-soft:#FFF1CC;
  --good:#1B8A57; --good-soft:#DDF3E8; --bad:#C23F38; --bad-soft:#FBE4E2; --flame:#E8590C;
  --s0:#2E3ECF; --s1:#D1495B; --s2:#1B8A57; --s3:#B5651D; --s4:#7B3FC4; --s5:#0F7F95; --s6:#C2408F; --s7:#5A6B1A;
  --f-display:"Unbounded", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,26,60,.06), 0 6px 20px rgba(20,26,60,.06);
  --row:44px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#161A2D; --surface-2:#1F2540; --fg:#E7EAF7; --muted:#99A1C3; --line:#2B3252;
  --ink:#8F9BFF; --ink-soft:#252C55; --star:#FFC23D; --star-ink:#FFD877; --star-soft:#3A2F12;
  --good:#4CC98A; --good-soft:#143326; --bad:#F27B72; --bad-soft:#3A1A1A; --flame:#FF8A3D;
  --s0:#8F9BFF; --s1:#F07D8C; --s2:#4CC98A; --s3:#E9A35E; --s4:#B88CF5; --s5:#4CC3D9; --s6:#EE80C0; --s7:#B3C55A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2D; --surface-2:#1F2540; --fg:#E7EAF7; --muted:#99A1C3; --line:#2B3252;
  --ink:#8F9BFF; --ink-soft:#252C55; --star:#FFC23D; --star-ink:#FFD877; --star-soft:#3A2F12;
  --good:#4CC98A; --good-soft:#143326; --bad:#F27B72; --bad-soft:#3A1A1A; --flame:#FF8A3D;
  --s0:#8F9BFF; --s1:#F07D8C; --s2:#4CC98A; --s3:#E9A35E; --s4:#B88CF5; --s5:#4CC3D9; --s6:#EE80C0; --s7:#B3C55A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.star-svg{width:1em;height:1em;fill:var(--star);vertical-align:-.12em}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:22px;height:22px;fill:var(--star)}
.pill{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 9px;font-size:.85rem}
.pill b{font-family:var(--f-num);font-size:1.05rem}
.wallet{background:var(--star-soft);color:var(--star-ink)}
.wallet svg{width:18px;height:18px;fill:var(--star)}
.flame{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.flame svg{width:17px;height:17px;fill:var(--line)}
.flame.on{color:var(--flame);border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
.flame.on svg{fill:var(--flame)}
.save{font-size:.75rem;color:var(--muted)}
.acct{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;display:flex;gap:8px;align-items:center;max-width:220px;min-width:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.big-av{width:40px;height:40px;font-size:1.05rem}
.acct span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
.tabs{max-width:1180px;margin:0 auto;padding:6px 16px 0;display:flex;gap:2px}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 72px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:1rem;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card > h3 + .sub{margin-bottom:4px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.note{background:var(--ink-soft);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note.warn{background:var(--bad-soft)}
.note.fire{background:color-mix(in srgb,var(--flame) 14%,var(--surface))}
.note .grow{flex:1;min-width:200px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.kpi b{color:var(--fg);font-family:var(--f-num)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.star{background:var(--star);border-color:var(--star);color:#2A1C00}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn.big{padding:12px 18px;font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:1.1rem;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.link{border:0;background:none;color:var(--ink);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.9rem;cursor:pointer}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:72px;font-family:var(--f-num)}
textarea{width:100%;min-height:160px;font-family:var(--f-num);font-size:.85rem;resize:vertical}
.addf{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.addf input[type=text]{flex:1 1 160px}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.check-row input{margin-top:4px;width:18px;height:18px;accent-color:var(--ink)}

/* ---------- tasks ---------- */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px}
.task:hover{background:var(--surface-2)}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task .btn{flex:none;white-space:nowrap}
.btn{white-space:nowrap}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;fill:none;stroke:var(--surface);stroke-width:3;opacity:0}
.done .chk,.chk.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.done .chk svg,.chk.on svg{opacity:1}
.chip{border:0;font-family:var(--f-num);font-size:.75rem;font-weight:700;background:var(--star-soft);color:var(--star-ink);border-radius:999px;padding:2px 8px;flex:none;white-space:nowrap}
.chip.static{cursor:default}
.tchip{font-family:var(--f-num);font-size:.72rem;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:1px 6px;flex:none}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink));flex:none}

/* ---------- today ---------- */
.day-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.goal{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring.ok .fg{stroke:var(--good)}
.ring text{font-family:var(--f-num);font-weight:700;font-size:17px;fill:var(--fg)}
.goal h3{font-size:1.05rem}
.goal-ok{color:var(--good);font-weight:700}
.main-rw .name{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:2px 0 10px;overflow-wrap:anywhere}
.bar{height:10px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--star);border-radius:10px;transition:width .4s ease}
.bar.ink i{background:var(--ink)}
.bar.good i{background:var(--good)}
.lucky{border:2px dashed color-mix(in srgb,var(--star) 60%,var(--line));background:var(--star-soft);color:var(--star-ink);border-radius:12px;padding:10px 14px;font-weight:800;display:inline-flex;gap:8px;align-items:center;margin-top:10px}
.lucky svg{width:20px;height:20px;fill:var(--star)}
.lucky.open{border-style:solid;cursor:default;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ---------- rewards ---------- */
.reward{display:flex;flex-direction:column;gap:10px}
.reward .top-r{display:flex;align-items:flex-start;gap:10px}
.reward h3{flex:1;min-width:0;overflow-wrap:anywhere}
.price{font-family:var(--f-num);font-weight:700;color:var(--star-ink);background:var(--star-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.reward.main-on{border-color:var(--star);box-shadow:0 0 0 1px var(--star),var(--shadow)}
.reward .bar i{background:var(--ink)}
.reward.ready .bar i{background:var(--good)}
.hint{font-size:.82rem;color:var(--muted)}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .t{flex:1;min-width:0}
.date{font-family:var(--f-num);font-size:.78rem;color:var(--muted)}
.plus{font-family:var(--f-num);font-weight:700;color:var(--good)}
.minus{font-family:var(--f-num);font-weight:700;color:var(--bad)}

/* ---------- calendar ---------- */
.cal-tools{display:flex;gap:6px 10px;align-items:center}
.cal-tools > div{flex:1;min-width:0}
.pool{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
.pool.hover,.cal-ad.hover{border-color:var(--ink);background:var(--ink-soft)}
.ctask{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px 5px 8px;border-radius:9px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--ink));font-size:.85rem;font-weight:600;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ctask span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.ctask.done{opacity:.55;text-decoration:line-through}
.ctask .chip{font-size:.68rem;padding:1px 6px}
.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.cal-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr));min-width:724px}
.cal-h{position:sticky;top:0;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);z-index:2}
.cal-h:first-child{border-left:0}
.cal-h b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.1rem}
.cal-h small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.cal-h.today b{color:var(--surface);background:var(--ink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;margin:2px auto 0}
.cal-h .credit{display:block;font-size:.68rem;color:var(--good);font-weight:800;min-height:1em}
.cal-lab{font-size:.68rem;color:var(--muted);padding:6px 6px 0 0;text-align:right;border-bottom:1px solid var(--line)}
.cal-ad{min-height:46px;padding:5px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cal-ad .ctask{font-size:.75rem;padding:3px 6px 3px 5px}
.cal-times{position:relative;height:calc(var(--rows) * var(--row))}
.cal-times span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-num);font-size:.68rem;color:var(--muted)}
.cal-col{position:relative;height:calc(var(--rows) * var(--row));border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px),var(--line) var(--row)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row)/2 - 1px),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--row)/2 - 1px),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--row)/2),transparent calc(var(--row)/2),transparent var(--row));cursor:cell}
.cal-col.today{background-color:color-mix(in srgb,var(--ink-soft) 45%,transparent)}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px;font-size:.75rem;line-height:1.25;background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--ink)) 45%,transparent);border-left:4px solid var(--c,var(--ink));overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:1}
.ev b{display:block;font-family:var(--f-num);font-size:.68rem;color:var(--muted);font-weight:700}
.ev .t{font-weight:700;overflow-wrap:anywhere}
.ev.done{opacity:.55}.ev.done .t{text-decoration:line-through}
.drop-prev{position:absolute;left:3px;right:3px;border-radius:8px;border:2px dashed var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent);pointer-events:none;z-index:3;font-family:var(--f-num);font-size:.72rem;color:var(--ink);font-weight:700;padding:2px 6px}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* ---------- forecast chart ---------- */
.chart-wrap{position:relative;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:420px;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.78rem;border-radius:8px;padding:5px 8px;white-space:nowrap;transform:translate(-50%,-110%)}
.big-num{font-family:var(--f-display);font-size:2rem;font-weight:500;line-height:1.1}
.week-dots{display:flex;gap:6px}
.week-dots span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.7rem;font-weight:800;background:var(--surface-2);color:var(--muted)}
.week-dots span.ok{background:var(--good);color:var(--surface)}
.week-dots span.fix{background:color-mix(in srgb,var(--flame) 30%,var(--surface));color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:12px}
.day{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-num);font-size:.72rem;color:var(--muted);padding:0}
.day.on{background:var(--star);border-color:var(--star);color:#2A1C00;font-weight:700}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.day:disabled{opacity:.35;cursor:default}
.mode-card{display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer}
.mode-card:hover{border-color:var(--ink)}
.mode-card.on{border-color:var(--ink);background:var(--ink-soft)}
.mode-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:.88rem}
.mode-card h3{font-family:var(--f-display);font-weight:500;font-size:1.15rem}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.srow input[type=text]{flex:1;min-width:140px}
.sw{display:flex;gap:4px}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--fg)}
details summary{cursor:pointer;font-weight:700}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.sheet-back{position:absolute;inset:0;background:rgba(10,12,30,.45)}
.sheet-card{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-card .x{position:absolute;right:10px;top:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
@media (max-width:560px){#sheet{place-items:end center;padding:0}.sheet-card{width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.won{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:8px 0}
.won .big-star{width:84px;height:84px;fill:var(--star);animation:pop .6s ease}
.won h2{font-size:1.6rem}

/* ---------- gate: landing / auth / onboarding ---------- */
#gate{min-height:100vh}
.gate-c{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.gate-card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow)}
.gate-card.wide{width:min(720px,100%)}
.gate-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.gate-brand svg{width:28px;height:28px;fill:var(--star)}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.auth-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field.auth input{padding:11px 12px;font-size:16px}
.pw{position:relative;display:block}
.pw input{padding-right:84px;width:100%}
.pw .link{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.82rem}
.err{color:var(--bad);font-size:.9rem;margin:0}
.ok{color:var(--good);font-size:.9rem;margin:0}
.err:empty,.ok:empty{display:none}
.steps-dots{display:flex;gap:6px}
.steps-dots i{width:26px;height:5px;border-radius:5px;background:var(--surface-2)}
.steps-dots i.on{background:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700}
.pick button.on{border-color:var(--star);background:var(--star-soft)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button,.choice label{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.choice span{color:var(--muted);font-size:.85rem}

.land{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.land-nav{display:flex;align-items:center;gap:12px;padding-block:8px 0}
.land-nav .gate-brand{margin-right:auto}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding-block:48px 36px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,5.4vw,3.4rem);line-height:1.05;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--star)}
.hero p{font-size:1.08rem;color:var(--muted);max-width:34em;margin:0 0 24px}
.hero-demo{display:flex;flex-direction:column;gap:10px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.mock .row{gap:8px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step-n{font-family:var(--f-num);font-weight:700;color:var(--ink);font-size:.85rem}
.step h3{font-family:var(--f-display);font-weight:500;font-size:1.1rem;margin:4px 0 6px}
.step p{color:var(--muted);margin:0;font-size:.95rem}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.land-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.land-foot{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-block:28px 24px}.steps,.modes{grid-template-columns:1fr}}

.burst{position:fixed;z-index:99;pointer-events:none;font-family:var(--f-num);font-weight:700;color:var(--star-ink);background:var(--star-soft);border-radius:999px;padding:2px 9px;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:300;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.burst{animation:none;opacity:0}.lucky.open,.won .big-star{animation:none}.ring .fg,.bar i{transition:none}}
@media (max-width:640px){
  .save{display:none}
  .acct{padding-right:3px}.acct span:last-child{display:none}
  .tab{padding:10px 9px;font-size:.88rem}
  h2{font-size:1.15rem}
  .brand span{display:none}
}

<script type="module">
/* ================= helpers ================= */
const STAR = '★';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const z = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekOf = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const today = () => iso(new Date());
const MON = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
const MON_G = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const DOW = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', 'пʼятниця', 'субота'];
const DOW_S = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const fmtShort = s => { const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtRange = w => fmtShort(w) + ' – ' + fmtShort(addDays(w, 6));
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtHM = m => z(Math.floor(m / 60)) + ':' + z(m % 60);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const dayWord = n => n + ' ' + plural(n, 'день', 'дні', 'днів');
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const STAR_PATH = 'M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z';
const STAR_SVG = `<svg class="star-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`;
const FLAME_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5s.9 3.1-1.4 6.1C10 10.3 7 12 7 16a5 5 0 0 0 10 0c0-2.3-1-3.9-1-3.9s2.5 1 2.5 4.4A6.5 6.5 0 0 1 5.5 16C5.5 9 13.5 7.8 13.5 1.5z"/></svg>';
const DIFF = { easy: { name: 'Легко', stars: 1 }, med: { name: 'Середньо', stars: 2 }, hard: { name: 'Важко', stars: 3 } };
const CAL_START = 6, CAL_END = 24; // hours shown in the calendar
const BASIC_BONUS_LIMIT = 2;

/* ================= state ================= */
function emptyState() {
  return {
    v: 2, mode: null, onboarded: false, joinedAt: today(), welcome: 0, newsletter: false,
    settings: { sphereBonus: 2 }, spheres: [], tasks: [], sphereDone: {}, challenges: [], rewards: [],
    extras: [], purchases: [], penalties: [], lucky: {}, repairs: {}, minimal: [], mainReward: null
  };
}
const REWARD_PRESETS = [
  { key: 'coffee', name: 'Кава в кавʼярні', cost: 10 },
  { key: 'food', name: 'Улюблена їжа', cost: 25 },
  { key: 'rest', name: 'Вечір без справ', cost: 25 },
  { key: 'movie', name: 'Кіно', cost: 40 },
  { key: 'thing', name: 'Нова річ для себе', cost: 60 }
];
function exampleState() {
  const s = emptyState();
  const w = weekOf(today());
  s.mode = 'basic'; s.onboarded = true; s.welcome = 5;
  s.rewards = REWARD_PRESETS.slice(0, 4).map(r => ({ id: uid(), name: r.name, cost: r.cost, createdAt: today() }));
  s.mainReward = s.rewards[0].id;
  ['Прогулянка 20 хв', 'Прочитати 10 сторінок', 'Розібрати пошту'].forEach((text, i) =>
    s.tasks.push(newTask({ text, diff: i === 1 ? 'med' : 'easy', day: today(), week: w })));
  return s;
}
function newTask(o) {
  const diff = o.diff || 'easy';
  return { id: uid(), text: o.text, diff, stars: o.stars ?? DIFF[diff].stars, week: o.week || weekOf(o.day || today()), day: o.day || null, time: o.time || null, dur: o.dur || 60, sphere: o.sphere || null, done: !!o.done, doneAt: o.done ? today() : null, bonus: !!o.bonus };
}
function migrate(s) {
  const d = emptyState();
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  s.settings = Object.assign({ sphereBonus: 2 }, s.settings);
  let changed = false;
  if (!s.v || s.v < 2) {
    s.v = 2; changed = true;
    if (s.tasks.length || s.rewards.length || s.spheres.length) { s.onboarded = true; s.joinedAt = today(); if (!s.welcome) s.welcome = 5; }
  }
  s.rewards.forEach(r => { if (!r.createdAt) r.createdAt = s.joinedAt; });
  s.tasks.forEach(t => { if (!t.dur) t.dur = 60; if (t.time === undefined) t.time = null; });
  if (s.mainReward && !s.rewards.some(r => r.id === s.mainReward)) s.mainReward = null;
  return { s, changed };
}

/* ================= rules ================= */
const isMinimal = d => state.minimal.some(p => d >= p.from && d <= p.to);
const goalOf = d => isMinimal(d) ? 1 : 3;
const isHard = () => state.mode === 'hard';

let C = null; // computed snapshot, rebuilt each render
function calc() {
  const T = today(), cnt = {}, ev = [];
  const sph = Object.fromEntries(state.spheres.map(s => [s.id, s.name]));
  for (const t of state.tasks) if (t.done && t.doneAt) {
    cnt[t.doneAt] = (cnt[t.doneAt] || 0) + 1;
    if (t.stars) ev.push({ date: t.doneAt, stars: t.stars, cat: t.bonus ? 'bonus' : 'tasks', label: t.text, sub: sph[t.sphere] || (t.bonus ? 'бонусна справа' : 'справа') });
  }
  for (const [w, map] of Object.entries(state.sphereDone || {})) for (const [sid, v] of Object.entries(map)) {
    if (sid === '__b' || !v) continue;
    ev.push({ date: typeof v === 'string' ? v : v.date, stars: typeof v === 'string' ? state.settings.sphereBonus : v.stars, cat: 'legacy', label: 'Сфера закрита: ' + (sph[sid] || '—'), sub: fmtRange(w) });
  }
  for (const c of state.challenges) for (const d of Object.keys(c.checks)) ev.push({ date: d, stars: c.stars, cat: 'challenge', label: c.name, sub: 'день челенджу' });
  for (const x of state.extras) ev.push({ date: x.date, stars: x.stars, cat: 'bonus', label: x.text, sub: 'бонусна справа' });
  if (state.welcome) ev.push({ date: state.joinedAt, stars: state.welcome, cat: 'welcome', label: 'Стартові зірки', sub: 'за реєстрацію' });

  const credited = {};
  let streak = 0, best = 0, d = state.joinedAt;
  const first = Object.keys(cnt).sort()[0];
  if (first && first < d) d = first;
  if (d > T) d = T;
  for (let guard = 0; d <= T && guard < 5000; guard++) {
    const c = (cnt[d] || 0) >= goalOf(d);
    credited[d] = c;
    if (c) {
      ev.push({ date: d, stars: isMinimal(d) ? 1 : 2, cat: 'day', label: 'День зараховано', sub: isMinimal(d) ? 'мінімальний план' : 'денна мета' });
      if (state.lucky[d]) ev.push({ date: d, stars: state.lucky[d], cat: 'lucky', label: 'Зірка дня', sub: 'випадковий бонус' });
      streak++; best = Math.max(best, streak);
      if (streak % 7 === 0) ev.push({ date: d, stars: 5, cat: 'streak', label: `Серія ${dayWord(streak)}`, sub: 'бонус за вогник' });
    } else if (!state.repairs[d] && d !== T) streak = 0;
    d = addDays(d, 1);
  }
  const earned = ev.reduce((a, e) => a + e.stars, 0);
  const spent = state.purchases.reduce((a, p) => a + p.cost, 0);
  const burned = state.penalties.reduce((a, p) => a + p.stars, 0);
  return { ev, cnt, credited, streak, best, earned, spent, burned, balance: earned - spent - burned, todayDone: cnt[T] || 0, goal: goalOf(T), todayCredited: !!credited[T] };
}
const CATS = {
  tasks: ['Справи', 'var(--ink)'], day: ['Денна мета', 'var(--good)'], lucky: ['Зірка дня', 'var(--star)'], streak: ['Вогник', 'var(--flame)'],
  challenge: ['Челенджі', 'var(--s4)'], bonus: ['Бонусні справи', 'var(--s5)'], welcome: ['Старт', 'var(--s7)'], legacy: ['Сфери (стара версія)', 'var(--s3)']
};

function repairState() {
  const T = today(), y = addDays(T, -1), yy = addDays(T, -2);
  if (C.credited[y] || state.repairs[y]) return null;
  if (!(C.credited[yy] || state.repairs[yy])) return null;
  if (isHard()) return 'hard';
  if (Object.keys(state.repairs).some(k => k !== y && daysBetween(k, T) <= 7)) return 'used';
  if (!C.todayCredited || C.todayDone < C.goal + 1) return 'need';
  return 'ready';
}
function pace() {
  const T = today(), days = Math.min(7, daysBetween(state.joinedAt, T) + 1), from = addDays(T, -6);
  const sum = C.ev.filter(e => e.cat !== 'welcome' && e.date >= from && e.date <= T).reduce((a, e) => a + e.stars, 0);
  const p = sum / Math.max(1, days);
  return days < 3 || p < 1 ? 5 : p;
}
const daysTo = cost => { const need = cost - Math.max(0, C.balance); return need <= 0 ? 0 : Math.ceil(need / pace()); };
const etaText = cost => { const n = daysTo(cost); return n === 0 ? 'Можна забирати' : '≈ ' + dayWord(n) + ' за твоїм темпом'; };
const mainReward = () => state.rewards.find(r => r.id === state.mainReward) || [...state.rewards].sort((a, b) => a.cost - b.cost)[0] || null;

function forecast() {
  const T = today(), span = Math.min(28, daysBetween(state.joinedAt, T));
  if (span < 7) return { need: 7 - span };
  const by = {};
  for (const e of C.ev) if (e.cat !== 'welcome') by[e.date] = (by[e.date] || 0) + e.stars;
  const daily = [];
  for (let i = span; i >= 1; i--) daily.push(by[addDays(T, -i)] || 0);
  const m = daily.reduce((a, b) => a + b, 0) / daily.length;
  const s = Math.sqrt(daily.reduce((a, b) => a + (b - m) ** 2, 0) / daily.length);
  const last7 = daily.slice(-7).reduce((a, b) => a + b, 0) / 7, prev7 = daily.length >= 14 ? daily.slice(-14, -7).reduce((a, b) => a + b, 0) / 7 : null;
  const band = k => 1.28 * s * Math.sqrt(k);
  return { span, daily, m, s, band, proj: Math.round(30 * m), lo: Math.max(0, Math.round(30 * m - band(30))), hi: Math.round(30 * m + band(30)), trend: prev7 && prev7 > 0 ? (last7 - prev7) / prev7 : null };
}

/* inactivity: 7+ days without any action burns stars (basic: half, hard: all) */
function checkInactivity() {
  if (!loaded || !state.onboarded || !state.mode) return null;
  const T = today();
  let last = state.joinedAt;
  const bump = d => { if (d && d > last && d <= T) last = d; };
  state.tasks.forEach(t => bump(t.doneAt));
  state.challenges.forEach(c => Object.keys(c.checks).forEach(bump));
  state.purchases.forEach(p => bump(p.date));
  state.penalties.forEach(p => bump(p.date));
  state.extras.forEach(x => bump(x.date));
  state.minimal.forEach(p => bump(p.from));
  const gap = daysBetween(last, T);
  if (gap < 7) return null;
  C = calc();
  const bal = Math.max(0, C.balance);
  const stars = isHard() ? bal : Math.floor(bal / 2);
  const p = { id: uid(), date: T, stars, days: gap, mode: state.mode };
  state.penalties.push(p);
  persist();
  return p;
}

/* ================= storage ================= */
const LKEY = 'zoryanyi-shlyakh-v1';
const FB_VER = '10.12.2';
const CFG = window.FIREBASE_CONFIG || {};
const CLOUD = !!(CFG.apiKey && CFG.projectId && !String(CFG.apiKey).includes('ВСТАВ'));
const DEVICE = uid() + uid();
let state = emptyState();
let loaded = false, fb = null, account = null, unwatch = null;
let lastSaved = null, rev = 0, pending = 0, saveTimer = null;
let ui = { tab: 'today', week: weekOf(today()), armed: {}, gate: 'loading', authMode: 'register', authMsg: '', authErr: '', pendingImport: null, editPrice: null, onb: null };
try { const t = localStorage.getItem(LKEY + ':tab'); if (['today', 'calendar', 'rewards', 'profile'].includes(t)) ui.tab = t; } catch (e) {}

function setSave(t) { const el = document.getElementById('save'); if (el) el.textContent = t; }
function readLocal() {
  try { const l = localStorage.getItem(LKEY); if (l) { const s = migrate(JSON.parse(l)).s; if (Array.isArray(s.spheres)) return s; } } catch (e) {}
  return null;
}
function toast(text) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3800);
}
function splitState(s) {
  const { tasks, ...rest } = s;
  const out = { main: JSON.stringify(rest), weeks: {} }, by = {};
  for (const t of tasks) (by[t.week] = by[t.week] || []).push(t);
  for (const [w, list] of Object.entries(by)) out.weeks[w] = JSON.stringify(list);
  return out;
}
async function loadFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const a = app.initializeApp(CFG);
  const au = auth.getAuth(a);
  au.languageCode = 'uk';
  let db;
  try { db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { db = fs.getFirestore(a); }
  if (window.ZS_EMULATOR) { auth.connectAuthEmulator(au, 'http://127.0.0.1:9099', { disableWarnings: true }); fs.connectFirestoreEmulator(db, '127.0.0.1', 8085); }
  fb = { auth, fs, au, db };
}
const mainRef = () => fb.fs.doc(fb.db, 'users', account.uid);
const weeksCol = () => fb.fs.collection(fb.db, 'users', account.uid, 'weeks');
async function fetchRemote(data) {
  const snap = await fb.fs.getDocs(weeksCol());
  const s = JSON.parse(data.main);
  s.tasks = [];
  snap.docs.forEach(d => { try { s.tasks.push(...JSON.parse(d.data().tasks)); } catch (e) {} });
  const m = migrate(s);
  state = m.s;
  lastSaved = splitState(state);
  rev = data.rev || 0;
  return m.changed;
}
async function openAccount() {
  showGate('loading');
  const snap = await fb.fs.getDoc(mainRef());
  if (!snap.exists()) { state = emptyState(); startOnboarding(); return; }
  const changed = await fetchRemote(snap.data());
  if (!state.onboarded) { startOnboarding(); return; }
  startApp(changed);
}
function watchRemote() {
  if (!CLOUD || !account) return;
  if (unwatch) unwatch();
  unwatch = fb.fs.onSnapshot(mainRef(), async snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    if (d.device === DEVICE || d.rev === rev || saveTimer || pending) return;
    try { await fetchRemote(d); render(); toast('Оновлено з іншого пристрою'); } catch (e) {}
  }, () => {});
}
function persist() {
  if (!loaded) return;
  setSave('Зберігаю…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!CLOUD) {
    try { localStorage.setItem(LKEY, JSON.stringify(state)); setSave('Лише в цьому браузері'); } catch (e) { setSave('Не збереглося'); }
    return;
  }
  if (account) flushCloud();
}
async function flushCloud() {
  const { fs, db } = fb, u = account.uid;
  const cur = splitState(state);
  let known = lastSaved ? Object.keys(lastSaved.weeks) : null;
  if (!known) { try { known = (await fs.getDocs(weeksCol())).docs.map(d => d.id); } catch (e) { known = []; } }
  const batch = fs.writeBatch(db);
  for (const [w, j] of Object.entries(cur.weeks)) if (!lastSaved || lastSaved.weeks[w] !== j) batch.set(fs.doc(db, 'users', u, 'weeks', w), { tasks: j });
  for (const w of known) if (!(w in cur.weeks)) batch.delete(fs.doc(db, 'users', u, 'weeks', w));
  rev = Date.now();
  batch.set(mainRef(), { main: cur.main, rev, device: DEVICE, updatedAt: fs.serverTimestamp(), newsletter: !!state.newsletter, email: state.newsletter ? (account.email || null) : null });
  lastSaved = cur;
  pending++;
  setSave(navigator.onLine === false ? 'Офлайн — збережу пізніше' : 'Зберігаю…');
  batch.commit().then(() => { pending--; if (!pending && !saveTimer) setSave('Збережено'); })
    .catch(e => { pending--; lastSaved = null; setSave('Не збереглося'); toast('Не вдалося зберегти: ' + authError(e)); setTimeout(persist, 5000); });
}
function commit() { persist(); render(); }
window.addEventListener('pagehide', () => { if (saveTimer) flush(); });

  'auth/weak-password': 'Пароль закороткий — мінімум 6 символів.', 'auth/email-already-in-use': 'Акаунт з такою поштою вже є. Спробуй увійти.',
  'auth/invalid-credential': 'Неправильна пошта або пароль.', 'auth/invalid-login-credentials': 'Неправильна пошта або пароль.',
  'auth/wrong-password': 'Неправильна пошта або пароль.', 'auth/user-not-found': 'Неправильна пошта або пароль.', 'auth/user-disabled': 'Цей акаунт вимкнено.',
  'auth/too-many-requests': 'Забагато спроб. Зачекай кілька хвилин і спробуй ще.', 'auth/network-request-failed': 'Немає звʼязку з сервером. Перевір інтернет.',
  'auth/operation-not-allowed': 'Вхід через пошту не увімкнено у Firebase.', 'auth/configuration-not-found': 'Firebase Authentication ще не увімкнено.',
  'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Неправильний apiKey у config.js.',
  'permission-denied': 'Немає доступу до бази. Перевір правила Firestore.', 'unavailable': 'Немає звʼязку з базою. Перевір інтернет.'
};
function authError(e) { return AUTH_ERR[e && e.code] || (e && e.message ? e.message.replace(/^Firebase:\s*/, '') : 'Щось пішло не так.'); }
async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const passEl = document.getElementById('auth-pass');
  const pass = passEl ? passEl.value : '';
  ui.lastEmail = email; ui.authErr = ''; ui.authMsg = '';
  const btn = document.getElementById('auth-submit'), errEl = document.getElementById('auth-err');
  if (!email) { errEl.textContent = 'Введи пошту.'; return; }
  if (ui.authMode !== 'reset' && pass.length < 6) { errEl.textContent = ui.authMode === 'register' ? 'Пароль закороткий — мінімум 6 символів.' : 'Введи пароль.'; return; }
  btn.disabled = true; btn.textContent = 'Зачекай…'; errEl.textContent = '';
  const A = fb.auth;
  try {
    if (ui.authMode === 'login') await A.signInWithEmailAndPassword(fb.au, email, pass);
    else if (ui.authMode === 'register') {
      const cred = await A.createUserWithEmailAndPassword(fb.au, email, pass);
      A.sendEmailVerification(cred.user).catch(() => {});
      ui.justRegistered = true;
    } else {
      await A.sendPasswordResetEmail(fb.au, email);
      ui.authMode = 'login'; ui.authMsg = 'Якщо акаунт з такою поштою існує, лист уже в дорозі. Перевір і папку «Спам».';
      renderGate();
    }
  } catch (e) { ui.authErr = authError(e); renderGate(); }
}

function ring(done, goal, ok) {

function forecastChart(F) {
  const W = 640, H = 230, L = 44, R = 70, Tp = 16, B = 30, iw = W - L - R, ih = H - Tp - B;
  const cum = []; let acc = 0; F.daily.forEach(v => { acc += v; cum.push(acc); });
  const startV = acc, endHi = startV + 30 * F.m + F.band(30), maxV = Math.max(10, endHi, startV);
  const step = Math.pow(10, Math.floor(Math.log10(maxV))) * (maxV / Math.pow(10, Math.floor(Math.log10(maxV))) > 5 ? 2 : 1);
  const top = Math.ceil(maxV / step) * step, n = F.span + 30;
  const x = i => L + (i / n) * iw, y = v => Tp + ih - v / top * ih;
  const past = cum.map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`);
  past.unshift(`${x(0).toFixed(1)},${y(0).toFixed(1)}`);
  const mid = [], hi = [], lo = [];
  for (let k = 0; k <= 30; k++) { const xi = x(F.span + k).toFixed(1); mid.push(`${xi},${y(startV + k * F.m).toFixed(1)}`); hi.push(`${xi},${y(startV + k * F.m + F.band(k)).toFixed(1)}`); lo.push(`${xi},${y(Math.max(startV, startV + k * F.m - F.band(k))).toFixed(1)}`); }
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`;
  const xT = x(F.span);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Накопичені зірки: факт за ${dayWord(F.span)} і прогноз на 30 днів">${g}
    <polygon points="${hi.join(' ')} ${lo.reverse().join(' ')}" fill="var(--ink)" opacity=".12"/>
    <line x1="${xT}" x2="${xT}" y1="${Tp}" y2="${Tp + ih}" stroke="var(--muted)" stroke-dasharray="2 4"/>
    <text x="${xT}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--fg)" font-weight="700">сьогодні</text>
    <text x="${x(0)}" y="${H - 10}" font-size="11" fill="var(--muted)">−${F.span} дн.</text>
    <text x="${x(n)}" y="${H - 10}" text-anchor="end" font-size="11" fill="var(--muted)">+30 дн.</text>
    <polyline points="${past.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${mid.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="${xT}" cy="${y(startV)}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(n) + 6}" y="${y(startV + 30 * F.m) + 4}" font-size="12" font-weight="700" fill="var(--fg)" font-family="JetBrains Mono, monospace">+${F.proj}</text>
    <text x="${x(n) + 6}" y="${y(startV + 30 * F.m) + 18}" font-size="10" fill="var(--muted)">прогноз</text>
    <rect id="fc-hit" x="${L}" y="${Tp}" width="${iw}" height="${ih}" fill="transparent" data-span="${F.span}" data-n="${n}" data-l="${L}" data-iw="${iw}" data-w="${W}"/>
  </svg>`;
}

/* ================= share card ================= */
async function shareCard(p) {
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920;
  const g = cv.getContext('2d');
  try { await document.fonts.ready; } catch (e) {}
  const grd = g.createLinearGradient(0, 0, 0, 1920); grd.addColorStop(0, '#151A2D'); grd.addColorStop(1, '#2E3ECF');
  g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 60; i++) { g.beginPath(); g.arc((i * 397) % 1080, (i * 613) % 1920, (i % 3) + 2, 0, 7); g.fill(); }
  g.save(); g.translate(540, 640); g.scale(14, 14); g.translate(-12, -12); g.fillStyle = '#FFC23D'; g.fill(new Path2D(STAR_PATH)); g.restore();
  g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '700 44px Manrope, sans-serif'; g.fillText('Я ЗАРОБИВ', 540, 960);
  g.fillStyle = '#fff'; g.font = '700 92px Unbounded, Manrope, sans-serif';
  const words = p.name.split(' '); let line = '', yy = 1090; const lines = [];
  for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > 900 && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line); lines.slice(0, 3).forEach(l => { g.fillText(l, 540, yy); yy += 110; });
  g.fillStyle = '#FFC23D'; g.font = '700 56px "JetBrains Mono", monospace'; g.fillText(`${p.cost} ★ · ${p.stat || ''}`, 540, yy + 30);
  g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '600 40px Manrope, sans-serif'; g.fillText('Зоряний шлях — гра у власне життя', 540, 1780);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], 'zoryanyi-shlyakh.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: `Я заробив: ${p.name}` }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zoryanyi-shlyakh.png';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Картинку збережено — додай її в сторіс');
}

/* ================= drag & drop (pointer-based: works with mouse and touch) ================= */
let drag = null, autoRaf = null, suppressClick = false;
function colTarget(col, clientY, offY) {
  const r = col.getBoundingClientRect(), row = r.height / (CAL_END - CAL_START);
  let mins = CAL_START * 60 + Math.round(((clientY - offY - r.top) / row) * 2) * 30;
  return Math.max(CAL_START * 60, Math.min(CAL_END * 60 - 30, mins));
}
function clearDropUI() {
  document.querySelectorAll('.drop-prev').forEach(x => x.remove());
  document.querySelectorAll('.hover').forEach(x => x.classList.remove('hover'));
}
function startDrag(e) {
  drag.started = true;
  const r = drag.el.getBoundingClientRect();
  drag.offY = drag.el.classList.contains('ev') ? Math.min(e.clientY - r.top, 20) : 0;
  const g = document.createElement('div');
  g.className = 'ctask drag-ghost'; g.style.setProperty('--c', drag.el.style.getPropertyValue('--c'));
  const t = state.tasks.find(x => x.id === drag.id);
  g.innerHTML = `<span class="t">${esc(t ? t.text : '')}</span>`;
  document.body.appendChild(g); drag.ghost = g;
  drag.el.classList.add('dragging'); document.body.classList.add('is-dragging');
  const loop = () => {
    if (!drag || !drag.started) return;
    const sc = document.getElementById('cal-scroll');
    if (sc) { const r2 = sc.getBoundingClientRect(); if (drag.x < r2.left + 40) sc.scrollLeft -= 12; else if (drag.x > r2.right - 40) sc.scrollLeft += 12; }
    if (drag.y < 70) window.scrollBy(0, -12); else if (drag.y > innerHeight - 70) window.scrollBy(0, 12);
    autoRaf = requestAnimationFrame(loop);
  };
  autoRaf = requestAnimationFrame(loop);
}
function moveDrag(e) {
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  clearDropUI();
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const zone = hit && hit.closest('[data-drop]');
  drag.target = null;
  if (!zone) return;
  if (zone.dataset.drop === 'col') {
    const mins = colTarget(zone, e.clientY, drag.offY);
    const t = state.tasks.find(x => x.id === drag.id), dur = (t && t.dur) || 60;
    const p = document.createElement('div');
    p.className = 'drop-prev';
    p.style.top = `calc(${(mins - CAL_START * 60) / 60} * var(--row))`; p.style.height = `calc(${dur / 60} * var(--row) - 2px)`;
    p.textContent = fmtHM(mins);
    zone.appendChild(p);
    drag.target = { type: 'col', day: zone.dataset.day, mins };
  } else { zone.classList.add('hover'); drag.target = { type: zone.dataset.drop, day: zone.dataset.day || null }; }
}
function endDrag() {
  cancelAnimationFrame(autoRaf);
  const t = state.tasks.find(x => x.id === drag.id), tg = drag.target;
  drag.ghost.remove(); drag.el.classList.remove('dragging'); document.body.classList.remove('is-dragging'); clearDropUI();
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
  if (!t || !tg) return;
  if (tg.type === 'col') { t.day = tg.day; t.time = fmtHM(tg.mins); t.week = weekOf(tg.day); t.dur = t.dur || 60; }
  else if (tg.type === 'allday') { t.day = tg.day; t.time = null; t.week = weekOf(tg.day); }
  else if (tg.type === 'pool') { t.day = null; t.time = null; t.week = ui.week; }
  commit();
}
document.addEventListener('pointerdown', e => {
  if (e.button > 0 || document.getElementById('app').hidden) return;
  const el = e.target.closest('.drag'), col = !el && e.target.closest('.cal-col');
  if (el) drag = { id: el.dataset.id, el, x0: e.clientX, y0: e.clientY, started: false };
  else if (col) drag = { col, x0: e.clientX, y0: e.clientY, started: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    if (!drag.el) { drag = null; return; } // moving on empty grid = scroll, not a tap
    startDrag(e);
  }
  moveDrag(e); e.preventDefault();
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.started) { drag = d; endDrag(); drag = null; return; }
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
  if (d.el) openTaskSheet(d.id);
  else if (d.col) openQuickAdd(d.col.dataset.day, colTarget(d.col, e.clientY, 0));
});
document.addEventListener('pointercancel', () => {
  if (drag && drag.started) { cancelAnimationFrame(autoRaf); drag.ghost.remove(); drag.el.classList.remove('dragging'); document.body.classList.remove('is-dragging'); clearDropUI(); }
  drag = null;
});

/* ================= feedback ================= */
function burst(el, n) {
  if (!el || n <= 0) return;
  const r = el.getBoundingClientRect();
  const b = document.createElement('span');
  b.className = 'burst'; b.textContent = '+' + n + STAR;
  b.style.left = (r.left + r.width / 2 - 18) + 'px'; b.style.top = (r.top - 6) + 'px';
  document.body.appendChild(b); setTimeout(() => b.remove(), 1000);
}
function arm(key) {
  if (ui.armed[key]) { delete ui.armed[key]; return true; }
  ui.armed = { [key]: true };
  setTimeout(() => { if (ui.armed[key]) { delete ui.armed[key]; render(); } }, 4000);
  render(); return false;
}
function afterDone(wasCredited) {
  const now = calc();
  if (!wasCredited && now.todayCredited) toast(`День зараховано! +${isMinimal(today()) ? 1 : 2}${STAR} і вогник горить. Відкрий зірку дня`);
}

/* ================= import helpers ================= */
function parsePlan(text) {
  const out = []; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const head = line.match(/^\d+[.)]\s*(.+?)\s*\+?\s*$/) || line.match(/^(.+?):\s*$/);
    if (head) { cur = { name: head[1].trim(), tasks: [] }; out.push(cur); continue; }
    if (!cur) continue;
    line.split(/\s\+\s|\s\+$/).map(s => s.trim()).filter(Boolean).forEach(t => cur.tasks.push(t));
  }
  return out;
}
const norm = s => s.toLowerCase().replace(/[^a-zа-яіїєґ0-9]/gi, '');
function findSphere(name) { const n = norm(name); return state.spheres.find(s => norm(s.name) === n) || state.spheres.find(s => { const m = norm(s.name); return m.startsWith(n.slice(0, 4)) || n.startsWith(m.slice(0, 4)); }); }
function readFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { try { const s = JSON.parse(r.result); if (!s || !Array.isArray(s.tasks) || !Array.isArray(s.rewards)) throw 0; res(migrate(s).s); } catch (e) { rej(new Error('Це не схоже на резервну копію Зоряного шляху.')); } };
    r.onerror = () => rej(new Error('Не вдалося прочитати файл.'));
    r.readAsText(file);
  });
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zoryanyi-shlyakh-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================= events ================= */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  goTab(b.dataset.tab);
});
function goTab(t) { ui.tab = t; ui.armed = {}; ui.editPrice = null; try { localStorage.setItem(LKEY + ':tab', t); } catch (er) {} render(); window.scrollTo({ top: 0 }); }

document.addEventListener('click', async e => {
  if (suppressClick) { suppressClick = false; return; }
  if (e.target.closest('[data-sheet-close]')) { closeSheet(); return; }
  const g = e.target.closest('[data-g]');
  if (g) {
    const k = g.dataset.g;
    if (k === 'auth' || k === 'mode-auth') { ui.authMode = g.dataset.m; ui.authErr = ''; ui.authMsg = ''; const em = document.getElementById('auth-email'); if (em) ui.lastEmail = em.value.trim(); showGate('auth'); }
    else if (k === 'landing') showGate('landing');
    else if (k === 'showpw') { const p = document.getElementById('auth-pass'); p.type = p.type === 'password' ? 'text' : 'password'; g.textContent = p.type === 'password' ? 'показати' : 'сховати'; }
    else if (k === 'logout') { if (fb) fb.auth.signOut(fb.au); }
    else if (k === 'retry') { ui.authErr = ''; try { await openAccount(); } catch (er) { ui.authErr = authError(er); showGate('error'); } }
    else if (k === 'onb-next') {
      const o = ui.onb; saveOnbInputs();
      if (o.modeOnly) { state.mode = o.mode; ui.onb = null; flush(); startApp(false); toast(o.mode === 'hard' ? 'Режим: важкий' : 'Режим: базовий'); return; }
      if (o.step === 2 && !o.picks.length && !o.custom) { toast('Обери хоча б одну винагороду'); return; }
      o.step++; renderGate();
    }
    else if (k === 'onb-back') { saveOnbInputs(); ui.onb.step--; renderGate(); }
    else if (k === 'onb-pick') { saveOnbInputs(); const o = ui.onb, i = o.picks.indexOf(g.dataset.k); if (i >= 0) o.picks.splice(i, 1); else if (o.picks.length < 3) o.picks.push(g.dataset.k); else toast('Максимум 3 — решту додаси потім'); renderGate(); }
    else if (k === 'onb-finish') finishOnboarding();
    else if (k === 'onb-local') adoptState(readLocal());
    return;
  }
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'onb-mode') { saveOnbInputs(); ui.onb.mode = b.dataset.m; renderGate(); return; }
  if (!loaded) return;
  const task = id && state.tasks.find(t => t.id === id);
  const T = today();
  switch (a) {
    case 'task': {
      const was = C.todayCredited;
      task.done = !task.done; task.doneAt = task.done ? T : null;
      if (task.done) { burst(b, task.stars); if (!task.day) { task.day = T; task.week = weekOf(T); } }
      commit(); if (task.done) afterDone(was); return;
    }
    case 'stars': { const seq = [1, 2, 3, 5, 10]; task.stars = seq[(seq.indexOf(task.stars) + 1) % seq.length]; return commit(); }
    case 'edit': return openTaskSheet(id);
    case 'settoday': task.day = T; task.week = weekOf(T); return commit();
    case 'go': return goTab(b.dataset.tab);
    case 'acct': return goTab('profile');
    case 'lucky': {
      if (!C.todayCredited || state.lucky[T]) return;
      const n = [1, 1, 1, 1, 1, 1, 2, 2, 2, 3][Math.floor(Math.random() * 10)];
      state.lucky[T] = n; burst(b, n); commit(); return;
    }
    case 'repair': { if (repairState() !== 'ready') return; state.repairs[addDays(T, -1)] = true; commit(); toast('Вогник повернувся — серія триває'); return; }
    case 'buy': {
      const r = state.rewards.find(x => x.id === id);
      if (!r || C.balance < r.cost) return;
      if (ui.tab !== 'rewards' || arm(id)) {
        const p = { id: uid(), rewardId: r.id, name: r.name, cost: r.cost, date: T };
        state.purchases.push(p); ui.armed = {}; commit(); openPurchase(p);
      }
      return;
    }
    case 'share': { const p = state.purchases.find(x => x.id === id); if (p) { if (!p.stat) openPurchase(p); shareCard(p); } return; }
    case 'main': state.mainReward = id; commit(); toast('Головну винагороду змінено'); return;
    case 'price-edit': ui.editPrice = ui.editPrice === id ? null : id; render('price-' + id); return;
    case 'price-cancel': ui.editPrice = null; render(); return;
    case 'delrw': if (arm('d' + id)) { state.rewards = state.rewards.filter(r => r.id !== id); if (state.mainReward === id) state.mainReward = null; commit(); } return;
    case 'delbuy': state.purchases = state.purchases.filter(p => p.id !== id); return commit();
    case 'wk': ui.week = addDays(ui.week, +b.dataset.d); return render();
    case 'wk0': ui.week = weekOf(T); return render();
    case 'chday': { const c = state.challenges.find(x => x.id === id), d = b.dataset.d; if (c.checks[d]) delete c.checks[d]; else { c.checks[d] = true; burst(b, c.stars); } return commit(); }
    case 'delch': if (arm(id)) { state.challenges = state.challenges.filter(c => c.id !== id); commit(); } return;
    case 'minimal': return openMinimal();
    case 'minimal-on': {
      const n = +b.dataset.n || 3;
      state.minimal = state.minimal.filter(p => p.to < T);
      state.minimal.push({ from: T, to: addDays(T, n - 1) });
      closeSheet(); commit(); toast(`Мінімальний план до ${fmtShort(addDays(T, n - 1))}: денна мета — 1 справа`); return;
    }
    case 'minimal-off': state.minimal = state.minimal.map(p => (T >= p.from && T <= p.to) ? { ...p, to: addDays(T, -1) } : p).filter(p => p.to >= p.from); commit(); toast('Мінімальний план вимкнено'); return;
    case 'set-mode': if (state.mode !== b.dataset.m) { state.mode = b.dataset.m; commit(); toast(state.mode === 'hard' ? 'Режим: важкий — тільки ти і твоя дисципліна' : 'Режим: базовий'); } return;
    case 'verify': try { await fb.auth.sendEmailVerification(account); toast('Лист надіслано на ' + account.email); } catch (er) { toast(authError(er)); } return;
    case 'pwreset': try { await fb.auth.sendPasswordResetEmail(fb.au, account.email); toast('Посилання для зміни пароля надіслано на ' + account.email); } catch (er) { toast(authError(er)); } return;
    case 'logout': if (saveTimer) flush(); ui.tab = 'today'; await fb.auth.signOut(fb.au); return;
    case 'export': return exportBackup();
    case 'imp-yes': state = ui.pendingImport; state.onboarded = true; if (!state.mode) state.mode = 'basic'; ui.pendingImport = null; commit(); toast('Дані відновлено з файлу'); return;
    case 'imp-no': ui.pendingImport = null; return render();
    case 'import-local': { const l = readLocal(); if (l) { ui.pendingImport = l; render(); } return; }
    case 'doimport': {
      const blocks = parsePlan(document.getElementById('import-text').value); let n = 0;
      for (const bl of blocks) {
        let s = findSphere(bl.name);
        if (!s) { s = { id: uid(), name: bl.name.replace(/^./, c => c.toUpperCase()), c: state.spheres.length % 8 }; state.spheres.push(s); }
        for (const text of bl.tasks) { state.tasks.push(newTask({ text, week: weekOf(T), sphere: s.id })); n++; }
      }
      if (!n) { document.getElementById('import-msg').textContent = 'Не знайшов жодної справи. Назви сфер мають бути пронумеровані: «1. Книги».'; return; }
      commit(); toast(`Додано ${n} ${plural(n, 'справу', 'справи', 'справ')} у план тижня — розклади їх у календарі`); return;
    }
    case 'reset': if (arm('reset')) { const m = state.mode; state = emptyState(); state.mode = m; state.onboarded = true; commit(); } return;
    case 'color': { const s = sphereById(id); s.c = +b.dataset.c; return commit(); }
    case 'delsph': if (arm(id)) { state.spheres = state.spheres.filter(s => s.id !== id); state.tasks.forEach(t => { if (t.sphere === id) t.sphere = null; }); commit(); } return;
    case 'sheet-del': state.tasks = state.tasks.filter(t => t.id !== id); closeSheet(); return commit();
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-f]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.f === 'auth') { submitAuth(); return; }
  if (!loaded) return;
  const T = today();
  const val = id => document.getElementById(id).value.trim();
  const num = (id, d) => { const n = parseInt(document.getElementById(id).value, 10); return isNaN(n) ? d : Math.max(0, n); };
  switch (f.dataset.f) {
    case 'addtoday': { const text = val('today-text'); if (!text) return; state.tasks.push(newTask({ text, day: T, ...readStars('today-stars') })); persist(); render('today-text'); return; }
    case 'addweek': { const text = val('week-text'); if (!text) return; state.tasks.push(newTask({ text, week: ui.week, ...readStars('week-stars') })); persist(); render('week-text'); return; }
    case 'addbonus': {
      const text = val('bonus-text'); if (!text) return;
      if (!isHard() && state.tasks.filter(t => t.bonus && t.doneAt === T).length >= BASIC_BONUS_LIMIT) { toast(`У базовому режимі — до ${BASIC_BONUS_LIMIT} бонусних справ на день`); return; }
      const was = C.todayCredited, t = newTask({ text, day: T, done: true, bonus: true, ...readStars('bonus-stars') });
      state.tasks.push(t); burst(f.querySelector('button'), t.stars); persist(); render(); afterDone(was); return;
    }
    case 'addrw': {
      const name = val('rw-name'); if (!name) return;
      const r = { id: uid(), name, cost: Math.max(1, num('rw-cost', 25)), createdAt: T, lockedUntil: addDays(T, 7) };
      state.rewards.push(r); if (!state.mainReward) state.mainReward = r.id; commit(); return;
    }
    case 'price': {
      const r = state.rewards.find(x => x.id === f.dataset.id), n = Math.max(1, num('price-' + r.id, r.cost));
      if (!isHard() && n < r.cost && r.lockedUntil && T < r.lockedUntil) { toast(`У базовому режимі знизити ціну можна з ${fmtShort(r.lockedUntil)}`); return; }
      r.cost = n; if (!isHard()) r.lockedUntil = addDays(T, 7); ui.editPrice = null; commit(); return;
    }
    case 'addch': {
      const name = val('ch-name'); if (!name) return;
      state.challenges.push({ id: uid(), name, start: T, days: Math.max(1, num('ch-days', 21)), stars: Math.min(isHard() ? 10 : 3, Math.max(1, num('ch-stars', 1))), checks: {} });
      return commit();
    }
    case 'addsph': { const name = val('new-sph'); if (!name) return; state.spheres.push({ id: uid(), name, c: state.spheres.length % 8 }); persist(); render('new-sph'); return; }
    case 'task-edit': {
      const t = state.tasks.find(x => x.id === f.dataset.id); if (!t) return;
      const was = C.todayCredited;
      t.text = val('te-text') || t.text;
      const done = document.getElementById('te-done').checked;
      if (done !== t.done) { t.done = done; t.doneAt = done ? T : null; }
      const day = document.getElementById('te-day').value || null;
      t.day = day; if (day) t.week = weekOf(day);
      t.time = day ? (document.getElementById('te-time').value || null) : null;
      t.dur = +document.getElementById('te-dur').value || 60;
      t.sphere = document.getElementById('te-sphere').value || null;
      if (isHard()) { const st = readStars('te-stars'); t.stars = st.stars; t.diff = st.diff; }
      else if (!t.done) { const st = readStars('te-stars'); t.stars = st.stars; t.diff = st.diff; }
      closeSheet(); commit(); if (t.done) afterDone(was); return;
    }
    case 'quick': {
      const text = val('qa-text'); if (!text) { document.getElementById('qa-text').focus(); return; }
      const day = f.dataset.day;
      state.tasks.push(newTask({ text, day, time: document.getElementById('qa-time').value || null, dur: +document.getElementById('qa-dur').value || 60, ...readStars('qa-stars') }));
      closeSheet(); commit(); return;
    }
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'onb-file' || el.id === 'import-file') {
    const f = el.files && el.files[0]; if (!f) return;
    try {
      const s = await readFile(f);
      if (el.id === 'onb-file') adoptState(s); else { ui.pendingImport = s; render(); }
    } catch (er) { if (el.id === 'onb-file') { const x = document.getElementById('onb-err'); if (x) x.textContent = er.message; } else toast(er.message); }
    el.value = ''; return;
  }
  if (!loaded) return;
  if (el.dataset.c === 'rename') { const s = sphereById(el.dataset.id), v = el.value.trim(); if (s && v) { s.name = v; commit(); } }
  if (el.dataset.c === 'newsletter') { state.newsletter = el.checked; persist(); toast(el.checked ? 'Підписка на новини увімкнена' : 'Підписку вимкнено'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rw-cost' && loaded) { const n = parseInt(e.target.value, 10); const el = document.getElementById('rw-eta'); if (el && n > 0) el.textContent = etaText(n); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('drag')) { e.preventDefault(); openTaskSheet(e.target.dataset.id); }
});
document.addEventListener('mousemove', e => {
  const hit = e.target.id === 'fc-hit' ? e.target : null, tip = document.getElementById('fc-tip');
  if (!tip) return;
  if (!hit) { tip.hidden = true; return; }
  const F = forecast(); if (F.need) return;
  const svg = hit.ownerSVGElement, r = svg.getBoundingClientRect(), W = +hit.dataset.w, L = +hit.dataset.l, iw = +hit.dataset.iw, n = +hit.dataset.n;
  const xv = (e.clientX - r.left) * (W / r.width);
  const i = Math.round(((xv - L) / iw) * n);
  let cum = 0; const cums = F.daily.map(v => (cum += v));
  const total = cum;
  let text;
  if (i <= F.span) { const back = F.span - i; text = back === 0 ? `Сьогодні: ${total}${STAR} за ${dayWord(F.span)}` : `${dayWord(back)} тому: ${i ? cums[i - 1] : 0}${STAR}`; }
  else { const k = i - F.span; text = `Через ${dayWord(k)}: ≈ +${Math.round(k * F.m)}${STAR} (${Math.max(0, Math.round(k * F.m - F.band(k)))}–${Math.round(k * F.m + F.band(k))})`; }
  const wr = document.getElementById('fc-wrap').getBoundingClientRect();
  tip.hidden = false; tip.textContent = text; tip.style.left = (e.clientX - wr.left) + 'px'; tip.style.top = (e.clientY - wr.top) + 'px';
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !loaded || document.getElementById('app').hidden) return;
  render();
  const p = checkInactivity(); if (p) { render(); openPenalty(p); }
});
setInterval(() => { if (loaded && !document.getElementById('app').hidden && !drag && document.getElementById('sheet').hidden && ui.tab === 'calendar') render(); }, 5 * 60 * 1000);

/* ================= boot ================= */
async function boot() {
  if (!CLOUD) {
    const l = readLocal();
    if (!l || !l.onboarded) { state = emptyState(); startOnboarding(); return; }
    state = l; startApp(false); return;
  }
  showGate('loading');
  try { await loadFirebase(); }
  catch (e) { ui.authErr = 'Не вдалося завантажити Firebase. Перевір інтернет і онови сторінку.'; showGate('error'); return; }
  fb.auth.onAuthStateChanged(fb.au, async user => {
    if (unwatch) { unwatch(); unwatch = null; }
    account = user; loaded = false; lastSaved = null; ui.authErr = ''; closeSheet();
    if (!user) { state = emptyState(); showGate('landing'); return; }
    try { await openAccount(); } catch (e) { ui.authErr = authError(e); showGate('error'); }
  });
}
boot();
</script>
